# Build both runtime images on a clean GitHub-hosted runner. A release must not
# inherit a developer's ignored ./nvkvm checkout: the named context is public
# nvkvm-pv, resolved from `main` to ONE COMMIT before either build starts (see
# the resolve step) so both images contain the same source and the release names
# what went into it. That commit is recorded inside the VMM image at
# /opt/nvkvm/.nvkvm-upstream-commit and as the org.nvkvm.source.revision label on
# both images; the broker stays binary-only otherwise.
name: release images

on:
  push:
    tags: ['v*']

# Do not cancel a tag release after one image has reached GHCR.
concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: build, push, and attest vmm + broker
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: repository checks
        run: make check

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # RESOLVE nvkvm-pv's `main` TO A COMMIT, ONCE, BEFORE ANY BUILD.
      #
      # Both build steps below used to name the source context as
      # `...nvkvm-pv.git#main` independently, and each fetch resolves `main`
      # separately. Two consequences, and the second is the one that bites:
      #
      #   * a release tag did not identify what was in the image. The
      #     attestation binds the image to THIS repository at github.sha, which
      #     is true and says nothing about which nvkvm-pv went in. Rebuilding
      #     the same tag a week later produced different bytes and an equally
      #     valid attestation.
      #
      #   * the VMM and the broker could be built from DIFFERENT nvkvm-pv
      #     commits in the same release, if main moved between the two steps.
      #     Those two images speak a protocol to each other, so a mismatch is
      #     not cosmetic -- and nothing in the release would have said so.
      #
      # Resolving once and pinning both builds to the resulting SHA fixes both.
      # It does not make `main` a reviewed release branch, and is not meant to:
      # what it guarantees is that a release names exactly one nvkvm-pv commit,
      # that both images contain it, and that the attestation covers something
      # a reader can go and look at.
      - name: resolve the nvkvm-pv source commit
        id: pvsrc
        shell: bash
        run: |
          set -euo pipefail
          repo=https://github.com/reindertpelsma/nvkvm-pv.git
          sha="$(git ls-remote "$repo" refs/heads/main | cut -f1)"
          case "$sha" in
            [0-9a-f]*) [ "${#sha}" -eq 40 ] || { echo "not a full sha: $sha" >&2; exit 1; } ;;
            *) echo "could not resolve nvkvm-pv main" >&2; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "context=$repo#$sha" >> "$GITHUB_OUTPUT"
          echo "building both images from nvkvm-pv $sha"

      - name: image names and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          for target in vmm broker; do
            image="$base-$target"
            tags="$image:$version"
            case "$version" in
              *-*) ;;
              *) tags="$tags,$image:latest" ;;
            esac
            echo "${target}_image=$image" >> "$GITHUB_OUTPUT"
            echo "${target}_tags=$tags" >> "$GITHUB_OUTPUT"
          done

      # Buildx also has a native provenance mode. Disable it here so each image
      # has one provenance mechanism with one documented verification command:
      # GitHub's OIDC-signed attestation emitted after the registry smoke test.
      - name: build and push VMM image
        id: push_vmm
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: vmm
          platforms: linux/amd64
          build-contexts: |
            nvkvm-source=${{ steps.pvsrc.outputs.context }}
          build-args: |
            NVKVM_SOURCE_LABEL=${{ steps.pvsrc.outputs.context }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.vmm_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=Sandboxed nvkvm QEMU VMM for SteamOS
            org.nvkvm.source.revision=${{ steps.pvsrc.outputs.sha }}

      - name: smoke-test pushed VMM image
        env:
          REF: ${{ steps.meta.outputs.vmm_image }}@${{ steps.push_vmm.outputs.digest }}
        run: |
          set -euo pipefail
          qemu=/opt/qemu-nvkvm/bin/qemu-system-x86_64
          docker run --rm --entrypoint "$qemu" "$REF" --version
          docker run --rm --entrypoint "$qemu" "$REF" -device help > devices.txt 2>&1
          grep -q virtio-nvgpu devices.txt || {
            echo "pushed VMM image has no virtio-nvgpu device" >&2
            exit 1
          }

      - name: attest VMM image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.meta.outputs.vmm_image }}
          subject-digest: ${{ steps.push_vmm.outputs.digest }}
          push-to-registry: true

      # Same builder and source context as VMM, so the expensive common QEMU
      # stage is reused within this clean runner without a cross-run cache.
      - name: build and push broker image
        id: push_broker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: broker
          platforms: linux/amd64
          build-contexts: |
            nvkvm-source=${{ steps.pvsrc.outputs.context }}
          build-args: |
            NVKVM_SOURCE_LABEL=${{ steps.pvsrc.outputs.context }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.broker_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=Wayland and X11 display broker for nvkvm SteamOS
            org.nvkvm.source.revision=${{ steps.pvsrc.outputs.sha }}

      - name: smoke-test pushed broker image
        env:
          REF: ${{ steps.meta.outputs.broker_image }}@${{ steps.push_broker.outputs.digest }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/nvkvm-display-broker \
            "$REF" --help

      - name: attest broker image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.meta.outputs.broker_image }}
          subject-digest: ${{ steps.push_broker.outputs.digest }}
          push-to-registry: true
