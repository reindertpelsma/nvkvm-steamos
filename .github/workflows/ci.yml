name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: compose and shell policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: repository checks
        run: make check

      # Lints both final targets and resolves the default GitHub named context,
      # but does not spend runner time compiling QEMU on every ordinary push.
      - name: validate both image build graphs
        run: docker compose build --check
