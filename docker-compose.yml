name: nvkvm-steamos

services:
  # Trusted only in the display-server sense: this process owns a window and
  # input focus in the logged-in host session. It has no /dev/kvm, NVIDIA
  # device, VM disk, recovery image, SSH key, or nvkvm source share.
  broker:
    image: nvkvm-steamos-broker:${NVKVM_IMAGE_TAG:-local}
    build:
      context: .
      target: broker
      additional_contexts:
        nvkvm-source: "${NVKVM_CONTEXT:-https://github.com/reindertpelsma/nvkvm-pv.git#main}"
      args:
        NVKVM_SOURCE_LABEL: "${NVKVM_CONTEXT:-https://github.com/reindertpelsma/nvkvm-pv.git#main}"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    # The entrypoint uses these to become the owner of the mounted desktop
    # runtime directory, and keeps them inheritable across that one setpriv so
    # the broker can drop again to NVKVM_BROKER_DROP_UID once its window is up.
    # The broker clears the whole capability set right after that transition.
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      NVKVM_BROKER_BACKEND: ${NVKVM_BROKER_BACKEND:-auto}
      NVKVM_BROKER_SIZE: ${NVKVM_BROKER_SIZE:-1280x800}
      NVKVM_BROKER_SCALE: ${NVKVM_BROKER_SCALE:-aspect}
      NVKVM_BROKER_FULLSCREEN: ${NVKVM_BROKER_FULLSCREEN:-0}
      # 1 = advertise only LINEAR, so the VMM must detile through the guest's
      # GPU instead of handing over its native tiling.  Needed when the host
      # compositor scans out on a different GPU than the guest renders on --
      # it cannot read NVIDIA tiling at any price -- and useful for forcing
      # that path on a single-GPU host.
      NVKVM_BROKER_LINEAR_ONLY: ${NVKVM_BROKER_LINEAR_ONLY:-0}
      # auto | native | linear | shm -- which rung of the presentation ladder
      # to offer.  auto walks it: the guest's own modifier, then a LINEAR
      # dma-buf, then shared memory, which no compositor can refuse.
      NVKVM_BROKER_PRESENT_MODE: ${NVKVM_BROKER_PRESENT_MODE:-}
      # Leave empty to pick a random unowned uid per start (600000+, above
      # the /etc/subuid ranges rootless containers allocate from).  The broker becomes
      # it AFTER the display connection is open, so it keeps the window and
      # input it already holds while losing all reach into the desktop user's
      # files.
      NVKVM_BROKER_DROP_UID: ${NVKVM_BROKER_DROP_UID:-}
      # off | guest-to-host | consent.  OFF BY DEFAULT: clipboard needs both
      # the VMM's qemu-vdagent chardev and spice-vdagent inside the guest, so
      # defaulting it on would promise something a given setup may not have.
      # `consent` is the one to choose: the guest may write your clipboard
      # (visibly, and only while this window has focus), and can never READ it
      # except at the instant you press the paste key -- ctrl+v, ctrl+shift+v
      # or shift+insert by default.  Works on both Wayland and X11.
      # consent, NOT off -- and deliberately different from the broker's own
      # default.  The broker ships off because a bare QEMU has no clipboard
      # transport unless you add the qemu-vdagent chardev yourself, so enabling
      # it there would advertise something that cannot work.  This container
      # wires that chardev and installs spice-vdagent in the guest, so the
      # opt-in has already happened by the time anyone reads this line.
      #
      # consent is still not "full": host->guest paste happens only on an
      # explicit trigger and on nothing else.  off | guest-to-host | consent.
      NVKVM_BROKER_CLIPBOARD: ${NVKVM_BROKER_CLIPBOARD:-consent}
      NVKVM_BROKER_CLIPBOARD_TRIGGER: ${NVKVM_BROKER_CLIPBOARD_TRIGGER:-}
    volumes:
      - broker-socket:/run/nvkvm
      # Trusted broker only. The untrusted VMM service has neither mount.
      # NVKVM_DESKTOP_RUNTIME_DIR, DELIBERATELY NOT XDG_RUNTIME_DIR.  compose
      # resolves ${...} against the environment of whoever runs it, and a shell
      # variable beats anything in .env -- so on a stack that must be run as
      # root this silently bound /run/user/0 instead of the desktop session's
      # /run/user/1000.  MEASURED: the broker then found no Wayland socket AND
      # derived desktop_uid=0 from this very mount (the uid is stat(1)ed off
      # it), so it could not have reached the session's socket even if it had
      # found one; and the audio container below decided the host had no
      # PipeWire at all.  A dedicated name cannot be shadowed by accident.
      # THE SOCKET, NOT THE WHOLE RUNTIME DIRECTORY.  /run/user/1000 also holds
      # the session D-Bus socket, gnupg/S.gpg-agent, keyring/*, systemd/private
      # and the flatpak documents portal.  Anything reaching code execution in
      # the broker before its --drop-user transition would own the desktop
      # session outright -- arbitrary commands via systemd --user
      # StartTransientUnit or the portals, plus the user's gpg and ssh agents.
      # The audio service two stanzas down already states this rule; the broker
      # did not follow it.
      - ${NVKVM_DESKTOP_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/run/host-runtime/${WAYLAND_DISPLAY:-wayland-0}
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/run/host-xauthority:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    restart: unless-stopped

  # The guest's audio, and NOTHING else.
  #
  # Deliberately not part of the broker: the broker holds the display, the
  # keyboard grab and the clipboard, and the player parses bytes chosen by a
  # possibly-compromised VMM.  Those two things do not belong in one process.
  #
  # Note what is NOT mounted here: $XDG_RUNTIME_DIR.  Mounting it would have
  # carried the Wayland socket in with it and defeated the point; the pulse
  # socket is world-accessible (srw-rw-rw-) so it can be bind-mounted ALONE,
  # which is why this can run as nobody with no capabilities at all.
  audio:
    image: nvkvm-steamos-audio:${NVKVM_IMAGE_TAG:-local}
    build:
      context: .
      target: audio
      args:
        NVKVM_REPOSITORY: ${NVKVM_REPOSITORY:-https://github.com/reindertpelsma/nvkvm-pv.git}
        NVKVM_REF: ${NVKVM_REF:-main}
    entrypoint: ["/usr/local/bin/nvkvm-audio-entrypoint"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    volumes:
      - broker-socket:/run/nvkvm
      # ONE socket per audio server, bind-mounted individually.  They are
      # srw-rw-rw-, so a single socket can be mounted on its own -- mounting
      # the runtime DIR would have brought the Wayland socket with it, which
      # is the whole thing this container exists to avoid.
      #
      # Both are listed because the host decides which exists: PipeWire hosts
      # have pipewire-0 (and usually pulse/native too, via pipewire-pulse),
      # legacy PulseAudio hosts have only pulse/native.  The player picks at
      # runtime.  On a host missing one, point its variable at /dev/null so
      # Docker does not create a stray directory in the runtime dir.
      # Same reason as the broker's runtime-dir mount above: not XDG_RUNTIME_DIR,
      # which follows the invoking shell and is /run/user/0 under sudo.
      - ${NVKVM_AUDIO_PW_SOCKET:-${NVKVM_DESKTOP_RUNTIME_DIR:-/run/user/1000}/pipewire-0}:/run/pw/pipewire-0
      - ${NVKVM_AUDIO_PULSE_SOCKET:-${NVKVM_DESKTOP_RUNTIME_DIR:-/run/user/1000}/pulse/native}:/run/pulse/native
    restart: unless-stopped

  # Untrusted VMM. Its only path toward the desktop is broker-socket. It gets
  # no host X11/Wayland socket and the broker gets none of this service's state.
  vmm:
    image: nvkvm-steamos-vmm:${NVKVM_IMAGE_TAG:-local}
    build:
      context: .
      target: vmm
      additional_contexts:
        nvkvm-source: "${NVKVM_CONTEXT:-https://github.com/reindertpelsma/nvkvm-pv.git#main}"
      args:
        NVKVM_SOURCE_LABEL: "${NVKVM_CONTEXT:-https://github.com/reindertpelsma/nvkvm-pv.git#main}"
    init: true
    read_only: true
    cap_drop: [ALL]
    # Required to make each nvkvm isolate use a separate uid and chroot. With
    # these absent, auto mode falls back to the weaker seccomp-only rung.
    cap_add: [SETUID, SETGID, SETPCAP, SYS_CHROOT]
    security_opt:
      # Docker's built-in syscall allowlist remains active. Each nvkvm isolate
      # then installs its much smaller, 20-syscall TSYNC seccomp allowlist.
      - no-new-privileges:true
    devices:
      - /dev/kvm:/dev/kvm
      # The cross-vendor present path allocates a sealed memfd and exports it
      # as a LINEAR dma-buf, so the same pages are both a pointer the guest's
      # GPU reads back into and a buffer any compositor can import.  Without
      # this node that path is unavailable and frames are dropped on a host
      # whose compositor cannot take the guest's tiling.  /dev/udmabuf is
      # root:kvm 0660 and this service already needs /dev/kvm, so it grants
      # nothing new; QEMU also already uses udmabuf for virtio-gpu blobs.
      - /dev/udmabuf:/dev/udmabuf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, graphics, display, video]
    environment:
      NVKVM_ISOLATE_MODE: uid+chroot
      # gl | readback.  Empty lets the VMM probe.  readback is how the shm
      # presentation tier is reached: the broker refusing dma-buf is only half
      # of it -- the VMM has to be on the staging path to have plain memory to
      # hand over in the first place.
      NVKVM_PRESENT_MODE: ${NVKVM_PRESENT_MODE:-}
      # Per-second present statistics, OFF unless set.  Forwarded so the opt-in
      # is actually reachable: the entrypoint honours this variable, but without
      # a line here compose never passes it into the container and there is no
      # supported way to turn the stats back on.  Empty is safe -- both the
      # entrypoint and QEMU treat an empty value as off.
      NVKVM_PRESENT_TIMING: ${NVKVM_PRESENT_TIMING:-}
      VM_MEM: ${STEAMOS_VM_MEM:-12G}
      VM_SMP: ${STEAMOS_VM_SMP:-8}
      # Empty = fit the host: 60% of the free space where the qcow2 lives,
      # clamped to [64G, 1024G].  qcow2 is sparse, so this costs nothing until
      # written -- and /home (i.e. the games budget) cannot be grown later
      # without a reinstall, because it sits last behind two fixed rootfs slots.
      NVKVM_STEAMOS_DISK_SIZE: ${NVKVM_STEAMOS_DISK_SIZE:-}
      NVKVM_STEAMOS_PROFILE: ${NVKVM_STEAMOS_PROFILE:-steamos}
      NVKVM_STEAMOS_RECOVERY_URL: ${NVKVM_STEAMOS_RECOVERY_URL:-}
      NVKVM_STEAMOS_LATEST: ${NVKVM_STEAMOS_LATEST:-0}
      NVKVM_BROKER_SOCKET: /run/nvkvm/steamos.sock
      NVKVM_STEAMOS_QEMU_DISPLAY: nvkvm-broker,socket=/run/nvkvm/steamos.sock
      NVKVM_STEAMOS_SSH_PORT: 15022
    volumes:
      - steamos-state:/var/lib/nvkvm-steamos
      # A named volume by default; set NVKVM_STEAMOS_DATA=/absolute/host/path
      # (or ./relative/path) to make the same guest ~/data mount a bind mount.
      - ${NVKVM_STEAMOS_DATA:-steamos-data}:/data
      - broker-socket:/run/nvkvm
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g
      - /var/tmp:rw,nosuid,nodev,size=256m
    ports:
      - 127.0.0.1:${NVKVM_STEAMOS_HOST_SSH_PORT:-15022}:15022
    depends_on:
      - broker
      - audio
    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  # Recovery image, qcow2, Alpine vmlinuz/initramfs/modloop, OVMF vars, logs,
  # and the private SSH key generated once by the VMM entrypoint.
  steamos-state:
    name: ${NVKVM_STEAMOS_STATE_VOLUME:-nvkvm-steamos-state}
  steamos-data:
    name: ${NVKVM_STEAMOS_DATA_VOLUME:-nvkvm-steamos-data}
  # A daemon-mounted tmpfs shared by exactly the two services. Mount the
  # directory, never the socket inode: broker restart creates a new inode.
  broker-socket:
    name: ${NVKVM_BROKER_SOCKET_VOLUME:-nvkvm-steamos-broker-socket}
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,mode=1777,nosuid,nodev,noexec
